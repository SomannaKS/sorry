
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Bad! 😅</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #dbeafe, #f0f9ff);
    overflow: hidden;
}

.card {
    width: 90%;
    max-width: 500px;
    padding: 40px 25px;
    text-align: center;
    background: #ffffff;
    border-radius: 22px;
    box-shadow: 0 15px 40px rgba(30, 64, 175, 0.12);
    animation: appear 0.8s ease;
}

.emoji {
    font-size: 65px;
    animation: bounce 1.5s infinite;
}

h1 {
    margin: 18px 0;
    color: #2563eb;
    font-size: 36px;
}

p {
    color: #475569;
    font-size: 18px;
    line-height: 1.7;
    margin: 18px 0;
}

h2 {
    color: #1d4ed8;
    margin-top: 25px;
    font-size: 22px;
}

.buttons {
    margin-top: 30px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
    min-height: 55px;
}

button {
    border: none;
    padding: 14px 24px;
    border-radius: 30px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s;
}

.yes {
    background: #2563eb;
    color: white;
}

.yes:hover {
    transform: scale(1.1);
}

.no {
    background: #fef3c7;
    color: #92400e;
    z-index: 10;
}

#message {
    display: none;
    margin-top: 25px;
    font-size: 19px;
    color: #2563eb;
    font-weight: bold;
    line-height: 1.6;
}

.footer {
    margin-top: 30px;
    font-size: 13px;
    color: #94a3b8;
}

@keyframes bounce {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-10px);
    }
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(25px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
</head>

<body>

<div class="card">

    <div class="emoji">🤝</div>

    <h1>Hey ASHA 😅</h1>

    <p>
        Okay, I know we argued. 🥺
        But I don't like being on bad terms with you.
    </p>

    <p>
        Himanshu ki kasam. Can we stop fighting now? ❤️
    </p>

    <h2>Can we call a truce?</h2>

    <div class="buttons">

        <button class="yes" onclick="forgive()">
            Yes 👍
        </button>

        <button class="no" id="noButton">
            No 😤
        </button>

    </div>

    <div id="message"></div>

    <div class="footer">
        No more arguments... at least for today! 😂
    </div>

</div>

<script>

const noButton = document.getElementById("noButton");

function moveButton() {

    const padding = 15;

    const maxX = window.innerWidth -
                 noButton.offsetWidth - padding;

    const maxY = window.innerHeight -
                 noButton.offsetHeight - padding;

    const randomX = Math.random() * Math.max(0, maxX);
    const randomY = Math.random() * Math.max(0, maxY);

    noButton.style.position = "fixed";
    noButton.style.left = randomX + "px";
    noButton.style.top = randomY + "px";
}

// Desktop: Move when mouse approaches
noButton.addEventListener("mouseenter", moveButton);

// Mobile: Move when touched
noButton.addEventListener("touchstart", function(event) {
    event.preventDefault();
    moveButton();
});

// YES button
function forgive() {

    document.getElementById("message").style.display = "block";

    document.getElementById("message").innerHTML =
        "Deal! 🤝😂 Truce accepted! Thanks to Lord Himanshu!";

    noButton.style.display = "none";

}

</script>

</body>
</html>
